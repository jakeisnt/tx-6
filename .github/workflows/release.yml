name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./packages/teenage/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "@ulnd/teenage is $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - run: bun run pack

      # @ulnd/teenage is the only published package; the rest of the workspace is bundled into it
      - name: Publish
        run: npm publish packed/ulnd-teenage-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
